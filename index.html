<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="preload" href="fonts/arefruqaa.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-italic-600.woff2" as="font" type="font/woff2" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yawm - Musulman au quotidien</title>
<meta name="theme-color" content="#0E6B47">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yawm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Une colonne (max 680px), barre d'onglets fixe en bas. Vert profond et doré léger.
   Onglet Chemine : chronologie verticale du Maghrib au Maghrib, étapes dépliables, repère « Maintenant ». */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --ink:#13281F; --muted:#56695F; --line:#D3DFD7;
  --accent:#0E6B47; --accent-ink:#FFFFFF; --gold:#A9852C; --gold-soft:#F1D98A; --soft:#E3EEE7;
  --ok:#1F7A4A; --warn:#A86B00; --mina:.10;
  --phase:#0E6B47;
  --display:"Marcellus", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --arabic:"Amiri","Traditional Arabic",serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1611; --surface:#12221A; --ink:#E7EFE9; --muted:#9BB0A3; --line:#244034;
    --accent:#4FBF8A; --accent-ink:#0B1611; --gold:#E0C26E; --soft:#183026; --ok:#6CC48F; --warn:#E3A93C; --mina:.13;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1611; --surface:#12221A; --ink:#E7EFE9; --muted:#9BB0A3; --line:#244034;
  --accent:#4FBF8A; --accent-ink:#0B1611; --gold:#E0C26E; --soft:#183026; --ok:#6CC48F; --warn:#E3A93C; --mina:.13;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.minaret{position:fixed;right:max(4px,calc(50% - 400px));bottom:64px;height:86%;opacity:var(--mina);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px calc(118px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
/* Bandeau */
.band{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--phase),#062A1C);color:#fff;margin:0 -16px;padding:14px 18px 12px;display:grid;gap:4px;border-bottom:3px solid var(--gold)}
.gear{position:absolute;top:10px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid rgba(241,217,138,.5);background:rgba(0,0,0,.15);color:#F1D98A;display:grid;place-items:center}
.gear svg{width:18px;height:18px}
.pagehead .gear{background:var(--surface);color:var(--gold);border-color:var(--line)}
.pagehead{position:relative}
.band>*{position:relative}
.band>.gear{position:absolute}
.band .eyebrow{padding-right:44px}
.band .bm{position:absolute;right:10px;top:-10px;height:150%;opacity:.35}
.band .eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-soft)}
.band h1{font-size:25px;line-height:1.15}
.band .meta{font-size:14px;opacity:.92}
.white{background:var(--surface);border:1px solid var(--gold);border-left-width:5px;border-radius:10px;padding:12px 14px;display:grid;gap:8px;margin-top:12px}
.white .wt{font-family:var(--display);font-size:19px}
.wmoons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.wmoons div{display:grid;justify-items:center;gap:1px;border-radius:10px;padding:6px 2px}
.wmoons div.cur{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.wmoons b{font-size:15px;color:var(--gold)}
.wmoons span{font-size:12px}
.wmoons .pc{font-size:11px;opacity:.75}
.white .wst{font-size:14px}
.white .wh{font-size:12.5px;opacity:.8;margin-top:-6px}
.white.dark .wh{margin-top:-2px}
.white .wn{font-size:12.5px;font-style:italic;color:var(--gold)}
.white.dark{background:rgba(0,0,0,.18);border-color:rgba(241,217,138,.6);color:#fff;margin-top:8px;padding:8px 10px;gap:4px}
.white.dark .wt{font-size:15px;color:#F1D98A}
.white.dark .wn{color:#F1D98A}
.white.dark .wmoons b{color:#F1D98A}
.skytabs{display:flex;gap:4px;margin-top:4px}
.skytabs button{border:1px solid rgba(241,217,138,.45);background:transparent;color:#F1D98A;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.skytabs button.on{background:#F1D98A;color:#0A3F2B}
.sky{width:100%;height:auto;display:block;margin-top:2px}
.moon{display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.35;margin-top:4px}
.moon svg{flex:none}
.moon .ms{font-size:11.5px;opacity:.85}
.times{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px}
.times div{background:rgba(255,255,255,.12);border-radius:7px;padding:4px 1px;text-align:center;font-size:11px;line-height:1.2}
.times div b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.times div.next{background:var(--gold-soft);color:#0A3F2B;font-weight:600}
.times div.next i{display:block;font-style:normal;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
/* Chronologie */
.tl{position:relative;margin-top:12px;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .fill{position:absolute;left:10px;top:8px;width:2px;background:var(--gold)}
.step{position:relative;margin-bottom:4px}
.step .dot{position:absolute;left:-25px;top:11px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.step.past .dot{background:var(--gold);border-color:var(--gold)}
.step.cur .dot{background:var(--accent);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.step.prayer .dot{border-radius:4px;transform:rotate(45deg)}
.sh{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 10px;text-align:left}
.step.cur .dot{width:17px;height:17px;left:-27px;top:12px}
.band.closed{padding-top:10px;padding-bottom:8px;gap:2px}
.band.closed .bm{height:120%;top:-6px}
.bmini{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-soft);padding-right:44px}
.btog{justify-self:center;margin-top:4px;border:1px solid rgba(241,217,138,.45);background:rgba(0,0,0,.15);color:#F1D98A;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:600}
.band.closed .gear{top:6px;width:32px;height:32px}
.step.lvl0 .sh{border:2px solid var(--gold);padding:9px 12px;grid-template-columns:54px 1fr auto;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));box-shadow:0 6px 18px -10px color-mix(in srgb,var(--accent) 60%,transparent)}
.step.lvl0 .sh .ti{font-family:var(--body);font-weight:700;font-size:19px;color:var(--accent)}
.step.lvl0 .sh .tm,.step.lvl0 .sh .sub,.step.lvl0 .rg small{font-weight:700}
.step.lvl0 .sbody .intro b,.step.lvl0 .sbody{font-weight:600}
.step.lvl0 .sh .tm{font-size:16px}
.step.lvl0 .sh .sub{font-size:12px}
.step.lvl1 .sh .ti{font-size:15px}
.step.lvl1 .sh .sub{font-size:11px}
.step.lvl2 .sh{padding:3px 10px;grid-template-columns:40px 1fr auto;opacity:.78}
.step.lvl2 .sh .ti{font-size:13.5px}
.step.lvl2 .sh .tm{font-size:12.5px}
.step.lvl2 .sh .sub{font-size:10.5px}
.step.lvl2 .rg .bars i{height:9px;width:3px}
.step.lvl2 .rg small{font-size:10px}
.step.lvl2 .dot{top:8px}
.step.lvl0 .rg .bars i{height:16px}

.nextb{display:inline-block;margin-left:6px;font-family:var(--body);font-size:11px;font-weight:700;color:#0A3F2B;background:var(--gold-soft);border-radius:99px;padding:1px 7px;vertical-align:2px}
.step.cur .sbody{padding:10px 0 6px}

.sh .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);font-size:14px}
.sh .ti{font-family:var(--display);font-size:16px;line-height:1.2}
.sh .sub{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted)}
.sh .chev{width:16px;height:16px;transition:transform .2s;color:var(--muted)}
.step.open .chev{transform:rotate(180deg)}
.sbody{display:none;padding:8px 0 4px;gap:8px}
.step.open .sbody{display:grid}
.intro{font-size:14px;color:var(--muted);margin:0}
.now{position:relative;margin:2px 0 6px;display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:700;font-size:14px}
.now::before{content:"";position:absolute;left:-24px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent)}
.now span{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.friday{margin-top:10px;border:1px solid var(--gold);border-left-width:5px;border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:8px}
.friday strong{color:var(--gold)}
/* Cartes */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.cur{background:var(--accent);color:var(--accent-ink)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.gold{color:var(--gold)}
.cards{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-align:left;width:100%;display:grid;gap:4px}
.card.ext{border-left:4px solid var(--warn)}
.card.coll{border-left:4px solid var(--gold)}
.card .t{font-weight:600}
.card .r{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:0}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;font-size:22px;line-height:1.9}
.q-ar{font-family:var(--quran);direction:rtl;text-align:right;font-size:26px;line-height:2.1}
.tr{font-size:16px}
/* Navigation */
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--gold);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
/* Ruban défilant */
.tick{grid-column:1/-1;overflow:hidden;white-space:nowrap;height:28px;line-height:28px;background:linear-gradient(90deg,#0B4632,#0E6B47);color:#fff;font-size:13.5px;cursor:pointer;border-bottom:1px solid #A9852C;position:relative}
.tick .tk{display:inline-block;will-change:transform;transform:translateX(100vw)}
.tick b{color:#F1D98A;font-weight:700}
.tick i{font-style:normal;opacity:.75;font-size:12px}
.nsteps{margin:4px 0;padding-left:22px;display:grid;gap:6px}
nav.bar a{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.bar a[aria-current="page"]{color:var(--accent)}
nav.bar svg{width:22px;height:22px}
.pagehead{padding:22px 0 8px;display:grid;gap:4px}
.pagehead h1{font-size:28px}
.pagehead p{margin:0;color:var(--muted)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.gold{border-color:var(--gold);color:var(--gold);border-radius:10px;font-weight:600}
.list{display:grid;gap:6px;margin-top:12px}
.sura{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.sura .n{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;text-align:center}
.sura .nm{font-weight:600}
.sura .sub{font-size:13px;color:var(--muted)}
.sura .an{font-family:var(--arabic);font-size:20px}
.verse{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.verse .num{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.back{border:none;background:none;color:var(--accent);font-weight:600;padding:16px 0 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;margin-top:12px}
.box h3{font-size:19px}
.src{font-size:13px;color:var(--muted)}
/* Dhikr */
.dk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin-top:12px}
.dk.def{border:2px solid var(--gold)}
.dk h2{font-size:22px}
.words{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.words span{font-family:var(--arabic);font-size:20px;background:var(--soft);border-radius:8px;padding:2px 10px}
.counter{display:grid;justify-items:center;gap:8px;padding:4px 0}
.counter .big{width:160px;height:160px;border-radius:50%;border:3px solid var(--gold);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;touch-action:manipulation}
.counter .lbl{font-family:var(--arabic);font-size:26px;text-align:center}
.steps{display:flex;gap:6px}
.steps span{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--gold)}
label{font-weight:600;font-size:14px;display:grid;gap:4px}
.rk{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-family:var(--body)}
.rg{display:inline-flex;align-items:center;gap:4px}
.rg .bars{display:inline-flex;gap:2px;align-items:flex-end}
.rg .bars i{display:block;width:4px;height:14px;border-radius:2px}
.rg small{font-size:11px;color:var(--muted);white-space:nowrap}
.rg.fard .bars i{background:var(--accent)}
.rg.sun .bars i{background:var(--gold)}
.rg.opt .bars i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gold)}
.rg.wit .bars i{background:#7F6BB3}
.rg.wit .bars i{height:11px}
.step.cur .rg .bars i{height:16px}
.rkleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.rkleg .rg .bars i{height:11px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:60;width:min(92vw,520px);background:#0B4632;color:#fff;border:1px solid #F1D98A;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s}
.toast.in{transform:translate(-50%,0)}
.toast b{color:#F1D98A}
.tl .fill{background:var(--line)!important;opacity:.7}
.tl .rest{position:absolute;left:9px;width:4px;bottom:8px;border-radius:2px;background:linear-gradient(var(--gold),color-mix(in srgb,var(--gold) 70%,var(--accent)))}
.step.past{opacity:.42}
.step.past .sh{box-shadow:none}
.step.past .dot{background:var(--line);border-color:var(--line)}
/* Chemine : prières en avant, actions et étapes passées amincies */
.tl .step:not(.prayer) .sh{padding:3px 10px;grid-template-columns:40px 1fr auto;background:transparent;border-style:dashed}
.tl .step:not(.prayer) .sh .ti{font-family:var(--body);font-size:13.5px}
.tl .step:not(.prayer) .sh .tm{font-size:12.5px}
.tl .step:not(.prayer) .sh .sub{font-size:10.5px}
.tl .step:not(.prayer) .dot{top:8px}
.tl .step.prayer .sh{padding:10px 12px;border-width:1.5px;grid-template-columns:50px 1fr auto}
.tl .step.prayer .sh .ti{font-size:18px}
.tl .step.prayer .sh .tm{font-size:15px}
.tl .step.prayer.lvl0 .sh{padding:18px 14px;border-width:2.5px;grid-template-columns:60px 1fr auto}
.tl .step.prayer.lvl0 .sh .ti{font-size:24px}
.tl .step.prayer.lvl0 .sh .tm{font-size:19px}
.tl .step.prayer.lvl0 .sh .sub{font-size:12.5px}
.tl .step.prayer.lvl0 .rg .bars i{height:20px;width:5px}
.tl .step.prayer.lvl0 .nextb{font-size:13px;padding:2px 9px}
.tl .step.prayer.lvl0 .dot{top:22px;width:17px;height:17px;left:-27px}
.tl .step.past{opacity:.5;margin-bottom:1px}
.tl .step.past .sh{padding:1px 10px;border:none;background:transparent;box-shadow:none;grid-template-columns:40px 1fr auto}
.tl .step.past .sh .ti{font-family:var(--body);font-size:12.5px}
.tl .step.past .sh .tm{font-size:11.5px}
.tl .step.past .sh .sub,.tl .step.past .rk,.tl .step.past .nextb{display:none}
.tl .step.past .dot{width:9px;height:9px;left:-23px;top:6px}
.tl .step.past.open .sh{background:var(--surface)}
.now.nowsky{display:block;margin:6px 0 8px}
.band.stick.closed{position:sticky;top:0;z-index:5}
.band .skywrap svg{display:block;width:100%;height:auto;max-height:30vh}
.band.closed{padding-top:8px;padding-bottom:4px;gap:0;border-bottom-width:2px}
.band.closed .skywrap svg{max-height:none}
.allday{margin:22px 2px 6px;opacity:.85}
.allday h4{font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.allday .adr{display:grid;gap:1px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;color:inherit;cursor:pointer}
.allday .adr .t{font-size:13.5px;font-weight:600}
.allday .adr .ph{font-size:13px;font-style:italic;color:var(--gold)}
.allday .adr .g{font-size:11px;color:var(--muted)}
.brow{display:flex;align-items:center;gap:8px;padding-right:40px;min-height:28px}
.brow .bmini{padding-right:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.brow .btog{margin:0;flex:none;font-size:11px;padding:1px 9px}
.band.closed .gear{top:4px;width:30px;height:30px}
.tl .card.mini{padding:6px 10px;gap:2px;border-radius:8px}
.tl .card.mini .t{font-size:14px;font-weight:600;line-height:1.25}
.tl .card.mini .pill{font-size:10.5px;padding:1px 6px}
.tl .card.mini .r{line-height:1}
.now.nowsky::before{top:4px}
.nowt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nowt span{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.fic{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;background:var(--soft);border-radius:10px}
.fic svg{width:40px;height:40px}
.fsteps{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px}
.fsteps>div{flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:4px;text-align:center}
.fsteps .fic{width:100%;max-width:56px;aspect-ratio:1;height:auto}.fsteps .fic svg{width:88%;height:88%}
.fsteps small{font-size:11px;color:var(--muted);line-height:1.2}

<script>
"use strict";
/* ---------- Réglages ---------- */
const CITIES={
  "Clermont-Ferrand":[45.7772,3.0870],"Paris":[48.8566,2.3522],"Lyon":[45.7640,4.8357],"Marseille":[43.2965,5.3698],
  "Lille":[50.6292,3.0573],"Toulouse":[43.6047,1.4442],"Bordeaux":[44.8378,-0.5792],"Strasbourg":[48.5734,7.7521],
  "Nantes":[47.2184,-1.5536],"Nice":[43.7102,7.2620],"Saint-Étienne":[45.4397,4.3872],"Grenoble":[45.1885,5.7245]
};
const METHODS={uoif:{n:"UOIF (12° / 12°)",f:12,i:12},mwl:{n:"Ligue islamique mondiale (18° / 17°)",f:18,i:17},isna:{n:"ISNA (15° / 15°)",f:15,i:15}};
let S={city:"Clermont-Ferrand",method:"uoif",asr:1,bed:"22:30",trad:"hamidullah",goal:25,speed:0.55,hsrc:"HJCoSA",hAdj:0,hOff:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("mq-settings")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("mq-settings",JSON.stringify(S))}catch(e){}}


/* ---------- Position ---------- */
function LL(){return S.loc&&isFinite(S.loc.lat)?[S.loc.lat,S.loc.lng]:(CITIES[S.city]||CITIES["Clermont-Ferrand"])}
function placeName(){return S.loc&&S.loc.name?S.loc.name:S.city}
function locate(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error("Ce téléphone ne permet pas la localisation ici."));
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=+pos.coords.latitude.toFixed(4),lng=+pos.coords.longitude.toFixed(4);let name="Ma position";
    try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=fr`);const j=await r.json();name=j.city||j.locality||j.principalSubdivision||name}catch(e){}
    S.loc={name,lat,lng,src:"gps"};S.locAsked=1;save();res(S.loc);
  },err=>rej(new Error(err.code===1?"Autorisation refusée. Tu peux l'activer dans les réglages du navigateur, ou choisir ta ville à la main.":"Position introuvable pour l'instant. Réessaie dehors ou choisis ta ville à la main.")),{enableHighAccuracy:false,timeout:15000,maximumAge:3600000});
})}
function distKm(a,b){const R=6371,dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng),x=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function toast(html){
  const show=()=>{let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
    t.innerHTML=html;t.classList.add("in");t.onclick=()=>t.classList.remove("in");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("in"),6000)};
  const wait=()=>{if(document.getElementById("splash"))setTimeout(wait,300);else show()};wait();
}
let LASTAUTO=0;
function autoLocate(){
  if(S.autoLoc===false||!navigator.geolocation||Date.now()-LASTAUTO<20*60000)return;LASTAUTO=Date.now();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const np={lat:+pos.coords.latitude.toFixed(4),lng:+pos.coords.longitude.toFixed(4)};
    const had=S.loc&&isFinite(S.loc.lat),prevName=placeName();
    if(had&&distKm(S.loc,np)<8)return;
    let name="Ma position";
    try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${np.lat}&longitude=${np.lng}&localityLanguage=fr`);const j=await r.json();name=j.city||j.locality||j.principalSubdivision||name}catch(e){}
    S.loc={name,lat:np.lat,lng:np.lng,src:"auto"};save();
    toast(had||prevName!==name?`<b>Tu t'es déplacé : ${esc(name)}.</b><br>Les horaires de prière sont mis à jour.`:`<b>Localisation : ${esc(name)}.</b><br>Horaires calculés pour ta position.`);
    if(["chemin","reglages","jeune"].includes(view)&&!$dlg.innerHTML)route();
  },err=>{if(err.code===1&&!S.locDeniedShown){S.locDeniedShown=1;save();toast(`Localisation non autorisée : horaires pour <b>${esc(placeName())}</b>.<br>Modifiable dans les Réglages.`)}},{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")autoLocate()});
async function searchCity(q){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=fr&format=json`);
  const j=await r.json();return (j.results||[]).map(x=>({name:x.name,detail:[x.admin1,x.country].filter(Boolean).join(", "),lat:+x.latitude.toFixed(4),lng:+x.longitude.toFixed(4)}));
}
/* ---------- Horaires de prière (calcul astronomique) ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const sin=d=>Math.sin(rad(d)),cos=d=>Math.cos(rad(d)),tan=d=>Math.tan(rad(d));
const asin=x=>deg(Math.asin(x)),acos=x=>deg(Math.acos(x)),atan2=(y,x)=>deg(Math.atan2(y,x)),acot=x=>deg(Math.atan(1/x));
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;return{decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)}}
function prayerTimes(date,lat,lng,m,asrF){
  const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const tz=-new Date(date.getFullYear(),date.getMonth(),date.getDate(),12).getTimezoneOffset()/60;
  const mid=t=>fix(12-sunPos(jd+t).eqt,24);
  const ang=(a,t,ccw)=>{const d=sunPos(jd+t).decl,n=mid(t),T=acos((-sin(a)-sin(d)*sin(lat))/(cos(d)*cos(lat)))/15;return n+(ccw?-T:T)};
  const asr=(f,t)=>{const d=sunPos(jd+t).decl;return ang(-acot(f+tan(Math.abs(lat-d))),t)};
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let k=0;k<2;k++){const p=x=>x/24;t={fajr:ang(m.f,p(t.fajr),true),sunrise:ang(0.833,p(t.sunrise),true),dhuhr:mid(p(t.dhuhr)),asr:asr(asrF,p(t.asr)),maghrib:ang(0.833,p(t.maghrib)),isha:ang(m.i,p(t.isha))}}
  const night=24-(t.maghrib-t.sunrise);
  if(isNaN(t.fajr)||t.sunrise-t.fajr>night*m.f/60)t.fajr=t.sunrise-night*m.f/60;
  if(isNaN(t.isha)||t.isha-t.maghrib>night*m.i/60)t.isha=t.maghrib+night*m.i/60;
  const out={},base=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  for(const k in t)out[k]=new Date(base.getTime()+(t[k]+tz-lng/15)*3600000);
  out.dhuhr=new Date(out.dhuhr.getTime()+60000);
  return out;
}
const hm=d=>d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

/* Jour islamique : du Maghrib au Maghrib suivant */
function islamicDay(now){
  const [la,ln]=LL(),m=METHODS[S.method];
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const T0=prayerTimes(today,la,ln,m,S.asr);
  const start=now<T0.maghrib?new Date(today.getTime()-86400000):today;

}

function whiteDays(now){

function fastTags(d){
  const h=hijri(d),tags=[],dow=d.getDay();if(!h)return{tags,no:false,h};
  let no=false;
  if(h.m===10&&h.d===1){tags.push("Aïd al-Fitr : pas de jeûne");no=true}
  else if(h.m===12&&h.d>=10&&h.d<=13){tags.push(h.d===10?"Aïd al-Adhâ : pas de jeûne":"Jour de Tachrîq : pas de jeûne");no=true}
  else{
    if(h.m===9)tags.push("Ramadân, jeûne obligatoire");
    if(dow===1)tags.push("Lundi");
    if(dow===4)tags.push("Jeudi");
    if(h.d>=13&&h.d<=15&&h.m!==9)tags.push("Jour blanc ("+h.d+")");
    if(h.m===12&&h.d===9)tags.push("Jour d'Arafat");
    if(h.m===1&&h.d===9)tags.push("Tâsoû'â'");
    if(h.m===1&&h.d===10)tags.push("Âshoûrâ'");
    if(h.m===10&&h.d>1)tags.push("Shawwâl : six jours");
    if(dow===5&&tags.length&&!tags.some(t=>/Jour blanc|Arafat|Âsh|Ramad/.test(t)))tags.push("pas le vendredi seul");
  }
  return{tags,no,h};
}

const QARIS=[["ar.alafasy","Mishary Al-Afasy"],["ar.husary","Mahmoud Al-Husary"],["ar.minshawi","Al-Minshawi"],["ar.abdulbasitmurattal","Abdul Basit"],["ar.mahermuaiqly","Maher Al-Muaiqly"],["ar.abdurrahmaansudais","As-Sudais"]];
const FULL={"ar.alafasy":["https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/","https://server8.mp3quran.net/afs/"],
 "ar.husary":["https://download.quranicaudio.com/quran/mahmood_khaleel_al-husaree/","https://server13.mp3quran.net/husr/"],
 "ar.minshawi":["https://download.quranicaudio.com/quran/muhammad_siddeeq_al-minshaawee/","https://server10.mp3quran.net/minsh/"],
 "ar.abdulbasitmurattal":["https://download.quranicaudio.com/quran/abdul_basit_murattal/","https://server7.mp3quran.net/basit/"],
 "ar.mahermuaiqly":["https://server12.mp3quran.net/maher/","https://download.quranicaudio.com/quran/maher_almu3aiqly/year1440/"],
 "ar.abdurrahmaansudais":["https://download.quranicaudio.com/quran/abdurrahmaan_as-sudays/","https://server11.mp3quran.net/sds/"]};
const FA=[new Audio(),new Audio()];FA.forEach(x=>x.preload="auto");
function fCur(){return FA[REC.fi||0]}function fNext(){return FA[1-(REC.fi||0)]}
function fSrc(el,n){const list=FULL[S.qari||"ar.alafasy"]||FULL["ar.alafasy"],f=String(n).padStart(3,"0")+".mp3";let k=0;
  el.onerror=()=>{k++;if(k<list.length){el.src=list[k]+f;if(el._want)el.play().catch(()=>{})}else if(el===fCur()&&REC.full){recStop();toast("La récitation demande une connexion internet.")}};
  el._n=n;el.src=list[0]+f;el.load()}
function fMeta(){if("mediaSession" in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:`Sourate ${REC.n}`,artist:(QARIS.find(q=>q[0]===(S.qari||"ar.alafasy"))||[0,""])[1],album:"Musulman au quotidien",artwork:[{src:"icons/icon-512.png",sizes:"512x512",type:"image/png"}]});
  navigator.mediaSession.setActionHandler("nexttrack",()=>{if(REC.full&&REC.n<114)fAdvance(false)});navigator.mediaSession.setActionHandler("previoustrack",()=>{if(REC.full){fCur().currentTime=0}})}catch(e){}}}
function fPrep(){REC.handoff=false;if(S.chain!==false&&REC.n<114)fSrc(fNext(),REC.n+1)}
async function fullPlay(){
  recStop();REC.mode="continu";REC.full=true;REC.i=0;recMark();
  const el=fCur();if(el._n!==REC.n||!el.src)fSrc(el,REC.n);el.muted=false;el.currentTime=0;el._want=true;
  el.play().then(()=>{REC.on=true;recMark()}).catch(()=>{REC.on=false;recMark()});
  fMeta();fPrep();recMark()}
async function fAdvance(already){
  const old=fCur();REC.n++;
  if(already){REC.fi=1-(REC.fi||0);old._want=false;old.pause();REC.on=true;fMeta();
    if(document.visibilityState==="visible"&&view==="coran"&&suraState){REC.keep=true;suraState={n:REC.n,to:null};await renderSura();REC.keep=false}
    fPrep();recMark();return}
  old.pause();old._want=false;
  if(document.visibilityState==="visible"&&view==="coran"&&suraState){REC.keep=true;suraState={n:REC.n,to:null};await renderSura();REC.keep=false}
  REC.fi=1-(REC.fi||0);fullPlay()}
FA.forEach(el=>{
  el.addEventListener("timeupdate",()=>{if(el!==fCur()||!REC.full||REC.handoff||S.chain===false||REC.n>=114)return;
    if(document.visibilityState==="hidden"&&el.duration&&el.duration-el.currentTime<4){REC.handoff=true;const nx=fNext();nx._want=true;nx.muted=true;nx.currentTime=0;nx.play().catch(()=>{})}});
  el.addEventListener("ended",()=>{if(el!==fCur()||!REC.full)return;if(S.chain===false||REC.n>=114){recStop();return}
    if(REC.handoff){const nx=fNext();try{nx.currentTime=0}catch(e){}nx.muted=false;if(nx.paused)nx.play().catch(()=>{})}
    fAdvance(!!REC.handoff)});
});
const REC={a:new Audio(),n:0,off:0,cnt:0,i:-1,basm:false,on:false};
REC.a.preload="auto";
function recUrl(g,br){return `https://cdn.islamic.network/quran/audio/${br||128}/${S.qari||"ar.alafasy"}/${g}.mp3`}
function recMark(){document.querySelectorAll(".verse.playing").forEach(v=>v.classList.remove("playing"));
  const b=document.getElementById("recbar");if(!b)return;
  b.querySelector(".rp").innerHTML=REC.on?"❚❚":"▶";b.querySelector(".ri").textContent=REC.i<0?"Prêt":(REC.full?`Sourate ${REC.n} 🔒`:(REC.basm?"Basmala":`Verset ${REC.i+1} / ${REC.cnt}`));
  b.classList.toggle("full",!!REC.full);
  if(REC.i>=0&&!REC.basm&&!REC.full){const v=document.querySelectorAll(".verse")[REC.i];if(v){v.classList.add("playing");const r=v.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-140)v.scrollIntoView({behavior:"smooth",block:"center"})}}}
function recPlay(i){
  if(i>=REC.cnt||i<0){recStop();return}
  REC.full=false;
  REC.i=i;const g=REC.off+i+1;
  REC.basm=(i===0&&REC.n!==1&&REC.n!==9&&!REC.basmDone);
  const src=REC.basm?1:g;let tried=128;
  REC.a.onerror=()=>{if(tried===128){tried=64;REC.a.src=recUrl(src,64);REC.a.play().catch(()=>{})}else{recStop();toast("La récitation demande une connexion internet.")}};
  REC.a.src=recUrl(src,128);REC.a.playbackRate=1;
  REC.a.play().then(()=>{REC.on=true;recMark()}).catch(()=>{REC.on=false;recMark()});
  if("mediaSession" in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:`Sourate ${REC.n}, verset ${i+1}`,artist:(QARIS.find(q=>q[0]===(S.qari||"ar.alafasy"))||[0,""])[1],album:"Musulman au quotidien",artwork:[{src:"icons/icon-512.png",sizes:"512x512",type:"image/png"}]})}catch(e){}}
  recMark()}
REC.a.onended=async()=>{if(REC.full)return;if(REC.basm){REC.basmDone=true;recPlay(REC.i)}else{REC.basmDone=true;if(REC.rep){recPlay(REC.i)}else recPlay(REC.i+1)}};
function recStop(){try{speechSynthesis.cancel()}catch(e){}REC.a.pause();FA.forEach(x=>{x._want=false;x.pause();x.muted=false});REC.on=false;REC.i=-1;REC.basm=false;REC.basmDone=false;REC.full=false;recMark()}
function recToggle(){if(REC.full){const e=fCur();if(e.paused){e.play();REC.on=true}else{e.pause();REC.on=false}recMark();return}if(REC.i<0){REC.basmDone=false;recPlay(0)}else if(REC.a.paused){REC.a.play();REC.on=true;recMark()}else{REC.a.pause();REC.on=false;recMark()}}
function recBar(){return `<div class="recbar" id="recbar"><button class="rb" data-r="prev" aria-label="Verset précédent">⏮</button><button class="rb rp" data-r="play" aria-label="Lecture">▶</button><button class="rb" data-r="next" aria-label="Verset suivant">⏭</button><span class="ri">Prêt</span><button class="rb rr" data-r="rep" aria-label="Répéter le verset" title="Répéter le verset">↻</button><button class="rb" data-r="stop" aria-label="Arrêter">■</button></div>`}

let hState={theme:null,q:""};
async function vHadiths(){
  $app.innerHTML='<p class="loading">Chargement des 1 790 hadiths…</p>';
  const [HD,TH]=await Promise.all([load("hadiths"),load("themes")]);
  const kids={},byId={};TH.forEach(t=>{byId[t.id]=t;(kids[t.p]=kids[t.p]||[]).push(t)});
  const desc=id=>{const s=new Set([id]),st=[id];while(st.length){const x=st.pop();(kids[x]||[]).forEach(k=>{s.add(k.id);st.push(k.id)})}return s};
  const draw=()=>{
    const th=hState.theme,q=hState.q.toLowerCase().trim(),set=th?desc(th):null;
    const L=HD.filter(x=>(!set||x.c.some(c=>set.has(c)))&&(!q||x.t.toLowerCase().includes(q)||x.fr.toLowerCase().includes(q)||String(x.id)===q));
    const path=[];let p=th;while(p){path.unshift(byId[p]);p=byId[p].p}
    const sub=(kids[th||null]||[]).filter(k=>k.n);
    $app.innerHTML=`<div class="pagehead">${GEAR}<h1>Hadiths</h1><p>1 790 hadiths traduits et gradés · HadeethEnc.com</p></div>
      <input class="search" id="qh" type="search" placeholder="Chercher un mot, un sujet ou un numéro" aria-label="Chercher un hadith" value="${esc(hState.q)}">
      <div class="row" style="margin-top:10px"><button class="btn ${!th?"on":""}" data-th="">Tous les thèmes</button>${path.map(t=>`<button class="btn on" data-th="${t.id}">${esc(t.n)}</button>`).join("")}</div>
      ${sub.length?`<div class="row" style="margin-top:8px">${sub.map(t=>`<button class="btn" data-th="${t.id}">${esc(t.n)}</button>`).join("")}</div>`:""}
      <p class="src" style="margin-top:10px">${L.length} hadith${L.length>1?"s":""}</p><div class="cards" id="hl"></div>`;
    let shown=0;const hl=document.getElementById("hl");
    const more=()=>{const part=L.slice(shown,shown+40);shown+=part.length;
      hl.insertAdjacentHTML("beforeend",part.map(x=>`<button class="card" data-h="${x.id}"><span class="t">${esc(x.t)}</span><span class="r"><span class="pill ${gradeCls(x.g)}">${esc(clean(x.g))}</span> ${esc(clean(x.tk).split("\n")[0])}</span></button>`).join(""));
      hl.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>openHadith(+b.dataset.h));
      const old=document.getElementById("more");if(old)old.remove();
      if(shown<L.length){hl.insertAdjacentHTML("afterend",`<button class="btn primary" id="more" style="margin-top:12px;width:100%">Afficher plus</button>`);document.getElementById("more").onclick=more}
    };
    more();
    $app.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{hState.theme=b.dataset.th?+b.dataset.th:null;draw()});
    let tmo;document.getElementById("qh").oninput=e=>{clearTimeout(tmo);tmo=setTimeout(()=>{hState.q=e.target.value;draw();const n=document.getElementById("qh");n.focus();n.setSelectionRange(n.value.length,n.value.length)},350)};
  };
  draw();
}
async function openHadith(id){
  const HD=await load("hadiths"),x=HD.find(h=>h.id===id);if(!x)return;
  sheet(`<h2>${esc(x.t)}</h2><div class="ar">${nl(x.ar)}</div><div class="tr">${nl(x.fr)}</div>
    <p class="src"><span class="pill ${gradeCls(x.g)}">${esc(clean(x.g))}</span> ${nl(clean(x.tk))}</p>
    <details><summary>Explication</summary><p>${nl(x.ex)}</p></details>
    ${x.be?`<details><summary>Enseignements du hadith</summary><p>${nl(x.be)}</p></details>`:""}
    <p class="src">Source : HadeethEnc.com, hadith n° ${x.id}, traduction française v1.17.0. <a href="${esc(x.l)}">Voir sur HadeethEnc</a></p>`);
}

function vReglages(){

  <div class="box">

    <label for="method">Méthode de calcul de Fajr et Isha<select id="method">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${k===S.method?"selected":""}>${v.n}</option>`).join("")}</select></label>

    <p class="src" style="margin:0">Aujourd'hui : Fajr ${hm(T.fajr)} · Lever ${hm(T.sunrise)} · Dhuhr ${hm(T.dhuhr)} · Asr ${hm(T.asr)} · Maghrib ${hm(T.maghrib)}. Compare-les une fois avec ta mosquée et ajuste la méthode si besoin.</p>
  </div>
  <div class="box"><h3>Début des mois hégiriens</h3>
    <label for="hsrc">Source<select id="hsrc">${Object.entries(HSRC).map(([k,v])=>`<option value="${k}" ${S.hsrc===k?"selected":""}>${v}</option>`).join("")}</select></label>
    <label for="hadj">Correction pour suivre ta mosquée<select id="hadj">${[-1,0,1].map(v=>`<option value="${v}" ${(S.hAdj||0)===v?"selected":""}>${v===0?"Aucune":(v>0?"+1 jour":"−1 jour")}</option>`).join("")}</select></label>
    <p class="src" style="margin:0" id="hst">${esc(hijriStatus())}</p>
    <div class="row"><button class="btn" id="hsync">Vérifier maintenant</button></div>
    <p class="src" style="margin:0">Aucun organisme français ne publie ses annonces sous une forme que l'appli peut lire. Si ta mosquée annonce un autre jour, utilise la correction. Allah seul sait.</p></div>
  ${notifBox()}
  <div class="box"><h3>Rappels dans l'agenda</h3>
    <p style="margin:0">Les rappels passent par l'agenda du téléphone : ils sonnent même appli fermée. Chaque fichier couvre les 60 prochains jours pour ${esc(placeName())} ; recrée-les tous les deux mois ou après un changement de ville.</p>
    <div class="cards">${Object.entries(ICS_KINDS).map(([k,v])=>`<button class="card" data-ics="${k}"><span class="t">Ajouter : ${esc(v.n)}</span><span class="r">${esc(v.d)}</span></button>`).join("")}</div>
    <p class="src" id="icsmsg" style="margin:0"></p></div>
  <div class="box"><h3>Comptage anonyme</h3><p style="margin:0">L'appli compte les ouvertures et les onglets consultés, de façon anonyme, avec GoatCounter : aucun nom, aucune position, aucun cookie, aucune adresse IP conservée. Ça permet seulement de savoir combien de personnes l'utilisent.</p></div><div class="box"><h3>Sources et versions</h3>
    <p style="margin:0">Hadiths traduits : encyclopédie HadeethEnc.com, français v1.17.0 (10 mai 2026), arabe v1.8.0.</p>
    <p style="margin:0">Textes arabes des recueils (Al-Bukhârî, Muslim, An-Nasâ'î) : éditions arabes publiées par le projet Hadith API.</p>
    <p style="margin:0">Coran : traductions françaises de QuranEnc.com (Hamidullah révisée par le centre Rowwad, Rashid Maash, Montada Islamic Foundation). Texte arabe Uthmani Hafs du Complexe du Roi Fahd.</p>

  </div>`;
  const up=()=>{if(city.value){S.city=city.value;S.loc=null;S.autoLoc=false}S.method=method.value;S.asr=+asr.value;S.bed=bed.value||"22:30";save();vReglages()};
  const gm=t=>{const m=document.getElementById("geomsg");if(m)m.textContent=t};
  document.getElementById("autoloc").onchange=e=>{S.autoLoc=e.target.checked;save();if(S.autoLoc){LASTAUTO=0;autoLocate()}};
  document.getElementById("geo").onclick=()=>{gm("Localisation…");S.autoLoc=true;locate().then(()=>vReglages()).catch(e=>gm(e.message))};
  document.getElementById("cityf").onsubmit=async e=>{e.preventDefault();const q=document.getElementById("cityq").value.trim();if(!q)return;gm("Recherche…");
    try{const L=await searchCity(q);const box=document.getElementById("cityres");
      box.innerHTML=L.length?L.map((x,i)=>`<button class="card" data-ci="${i}"><span class="t">${esc(x.name)}</span><span class="r">${esc(x.detail)}</span></button>`).join(""):"";
      gm(L.length?"Touche ta ville.":"Aucune ville trouvée.");
      box.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{const x=L[+b.dataset.ci];S.loc={name:x.name,lat:x.lat,lng:x.lng,src:"search"};S.autoLoc=false;save();vReglages()});
    }catch(err){gm("La recherche a besoin d'internet.")}};
  ["city","method","asr","bed"].forEach(id=>document.getElementById(id).onchange=up);
  $app.querySelectorAll("[data-ics]").forEach(b=>b.onclick=()=>downloadICS(b.dataset.ics));
  bindNotif();
  document.getElementById("hsrc").onchange=e=>{S.hsrc=e.target.value;save();syncHijri(true).then(()=>{if(view==="reglages")vReglages()});vReglages()};
  document.getElementById("hadj").onchange=e=>{S.hAdj=+e.target.value;save();vReglages()};
  document.getElementById("hsync").onclick=()=>{document.getElementById("hst").textContent="Vérification…";syncHijri(true).then(()=>{if(view==="reglages")vReglages()})};
}

e le premier.","ar":"إن أَوْلَى الناس بالله من بَدَأَهُمْ بالسلام","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî - Rapporté par Abû Dâwud]"},{"id":3710,"fr":"« Le meilleur des hommes est celui qui vit longtemps et fait de bonnes œuvres. »","ar":"خير الناس من طال عمره وحسن عمله","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî - Rapporté par Aḥmad - Rapporté par Ad-Dârimî]"},{"id":4191,"fr":"Celui qui sort à la recherche du savoir est dans le sentier d'Allah jusqu'à ce qu'il revienne.","ar":"من خَرج في طلب العلم فهو في سَبِيلِ الله حتى يرجع","g":"[Bon]","ref":"[Rapporté par At-Tirmidhî]"},{"id":4204,"fr":"Celui à qui Allah veut du bien, Il l’éprouve","ar":"من يرد الله به خيرا يصب منه","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî]"},{"id":4319,"fr":"Allah a certes prescrit la bienfaisance en toute chose !","ar":"إن الله كتب الإحسان على كل شيء","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":4704,"fr":"Sois dans ce bas-monde comme si tu étais un étranger ou comme quelqu’un de passage !","ar":"كن في الدنيا كأنك غريب أو عابر سبيل","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî]"},{"id":4717,"fr":"Aucun de vous ne croira vraiment jusqu'à ce qu'il aime pour son frère ce qu'il aime pour lui-même.","ar":"لا يؤمن أحدكم، حتى يحب لأخيه ما يحب لنفسه","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":4797,"fr":"Celui qui se repent avant que le soleil ne se lève de son couchant, Allah accepte son repentir.","ar":"مَنْ تَابَ قَبْلَ أَنْ تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا تَابَ اللهُ عَلَيْهِ","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":4928,"fr":"Le croyant ne se fait pas piquer deux fois depuis le même endroit.","ar":"لا يلدغ المؤمن من جحر واحد مرتين","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":5328,"fr":"L’injustice sera ténèbres au Jour de la Résurrection.","ar":"الظلم ظلمات يوم القيامة","g":"[Authentique dans ses deux versions]","ref":"[Rapporté par Muslim - Rapporté par Al-Bukhârî et Muslim]"},{"id":5361,"fr":"L’agrément d’Allah passe par l’agrément des parents, et Sa colère passe par la colère des parents.","ar":"رضا الله في رضا الوالدين، وسَخَطُ الله في سَخَطِ الوالدين","g":"[Bon car renforcé par d'autres chaînes de rapporteurs]","ref":"[Rapporté par At-Tirmidhî]"},{"id":5363,"fr":"Mange, bois, habille-toi et fais l'aumône, sans excès ni orgueil.","ar":"كُلْ، واشربْ، والبسْ، وتصدقْ في غير سَرَفٍ، ولا مَخِيْلَة","g":"[Bon]","ref":"[Rapporté par Ibn Mâjah - Rapporté par Al-Bûkhârî en annotation, mais sous une formulation catégorique - Rapporté par Aḥmad]"},{"id":5383,"fr":"Lisez le Coran car il viendra, certes, le Jour de la Résurrection intercéder au profit de ses compagnons.","ar":"اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعا لأصحابه","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":5435,"fr":"Quiconque a accompli la prière de l’aube est placé sous la protection d’Allah","ar":"من صلى صلاة الصبح فهو في ذمة الله","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":5478,"fr":"La pudeur fait partie de la foi","ar":"الحياء من الإيمان","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":5518,"fr":"Celui à qui Allah veut du bien, Il lui fait comprendre la Religion","ar":"من يرد الله به خيرا يفقهه في الدين","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":5803,"fr":"Les meilleurs d’entre vous sont certes ceux qui ont les meilleurs comportements.","ar":"إن من خياركم أحسنكم أخلاقا","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":5805,"fr":"Allah a dit : \"Dépense, ô Fils d'Adam ! Je dépenserai pour toi.\"","ar":"قال الله: أنفق يا ابن آدم أنفق عليك","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":5913,"fr":"Le meilleur d'entre vous est celui qui a appris le Coran et l'a enseigné.","ar":"خيركم من تعلم القرآن وعلمه","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî]"},{"id":6057,"fr":"La nourriture de deux est suffisante pour trois et la nourriture de trois est suffisante pour quatre.","ar":"طعام الاثنين كافي الثلاثة، وطعام الثلاثة كافي الأربعة","g":"[Authentique]","ref":"[Rapporté par Muslim - Rapporté par Al-Bukhârî et Muslim]"},{"id":6271,"fr":"Quiconque nourrit un jeûneur [pour la rupture du jeûne] aura la même récompense que lui.","ar":"من فطر صائمًا كان له مثل أجره","g":"[Authentique]","ref":"[Rapporté par Ibn Mâjah - Rapporté par At-Tirmidhî - Rapporté par An-Nassâ'î - Rapporté par Aḥmad - Rapporté par Ad-Dârimî]"},{"id":8879,"fr":"Si tu épies les erreurs des musulmans, tu les auras dépravés ou presque.","ar":"إنك إن اتَّبَعْتَ عَوْرَاتِ المسلمين أفْسَدْتَهُم، أو كِدْتَ أن تُفْسِدَهُم","g":"[Authentique]","ref":"[Rapporté par Abû Dâwud]"},{"id":10847,"fr":"Embellissez le Coran avec vos voix !","ar":"زينوا القرآن بأصواتكم","g":"[Authentique]","ref":"[Rapporté par Ibn Mâjah - Rapporté par An-Nassâ'î - Rapporté par Abû Dâwud - Rapporté par Aḥmad]"},{"id":11203,"fr":"Lorsqu'Allah veut du bien pour un serviteur, Il l’utilise avant sa mort.","ar":"إذا أراد الله بعبد خيرا استعمله قبل موته","g":"[Authentique]","ref":"[Rapporté par Aḥmad]"},{"id":58110,"fr":"Le meilleur mariage est le plus facile !","ar":"خير النكاح أيسره","g":"[Authentique]","ref":"[Rapporté par Abû Dâwud]"},{"id":65089,"fr":"Quiconque construit une mosquée pour Allah, alors Allah lui construit son équivalent au Paradis.","ar":"من بنى مسجدا لله بنى الله له في الجنة مثله","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":66519,"fr":"Délaisse ce qui te jette dans le doute pour ce qui ne suscite aucun doute.","ar":"دع ما يريبك إلى ما لا يريبك","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî et An-Nassâ'î]"},{"id":66531,"fr":"Pas de préjudice ni riposte préjudiciable.","ar":"لا ضرر ولا ضرار","g":"[Bon]","ref":"[Rapporté par Ibn Mâjah, Ad-Dâraqutnî et d'autres de manière Musnad]"},{"id":3441,"fr":"La prière en groupe est supérieure à la prière individuelle de vingt-sept degrés.","ar":"صلاة الجماعة أفضل من صلاة الفذ بسبع وعشرين درجة","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":3588,"fr":"Le siwâk est une purification pour la bouche et une satisfaction du Seigneur.","ar":"السواك مطهرة للفم، مرضاة للرب","g":"[Authentique]","ref":"[Rapporté par An-Nassâ'î et Ahmad]"},{"id":3368,"fr":"L'ornement du croyant atteindra ce qu'atteint l'eau des ablutions.","ar":"تبلغ الحلية من المؤمن حيث يبلغ الوضوء","g":"[Authentique]","ref":"[Rapporté par Muslim dans ses deux versions - Rapporté par Al-Bukhârî et Muslim]"},{"id":5474,"fr":"Certes, le plus détesté des hommes auprès d'Allah est le querelleur invétéré.","ar":"إن أبغض الرجال إلى الله الألد الخصم","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":4188,"fr":"Quiconque effectue une dépense dans le sentier d’Allah, elle lui sera inscrite sept cents fois !","ar":"مَنْ أَنْفَقَ نَفَقَةً في سَبِيل الله كُتب له سَبْعُمِائَةِ ضِعْفٍ","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî - Rapporté par An-Nassâ'î - Rapporté par Aḥmad]"},{"id":6267,"fr":"Quiconque emprunte une voie à la recherche d'un savoir, Allah lui facilite [grâce à cela] une voie vers le Paradis","ar":"من سلك طريقًا يبتغي فيه علمًا سهل الله له طريقًا إلى الجنة","g":"[Bon]","ref":"[Rapporté par Ibn Mâjah - Rapporté par At-Tirmidhî - Rapporté par Abû Dâwud - Rapporté par Aḥmad - Rapporté par Ad-Dârimî]"},{"id":65047,"fr":"N'apprenez pas la science pour vous en pavaner auprès des savants, ni pour vous disputer avec les ignorants","ar":"لا تعلموا العلم لتباهوا به العلماء، ولا لتماروا به السفهاء","g":"[Authentique]","ref":"[Rapporté par Ibn Mâjah]"},{"id":66522,"fr":"Ô jeune homme ! Je vais t’enseigner quelques paroles : préserve (les droits d') Allah, Il te préservera ; préserve (les droits d') Allah","ar":"يا غلام إني أعلمك كلمات: احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî et d'autres]"},{"id":10118,"fr":"Allah n’enlèvera pas le savoir en l’arrachant aux gens, mais il enlèvera le savoir en enlevant les savants","ar":"إن الله لا يقبض العلم انتزاعًا يَنْتَزعهُ مِنَ النَّاسِ، وَلكِنْ يَقْبِضُ العِلْمَ بِقَبْضِ العُلَمَاءِ","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":4182,"fr":"Ô Messager d’Allah ! Quelle est la personne qui mérite le plus que je lui tienne bonne compagnie ? Ta mère, puis ta mère, puis ta mère, ensuite ton père et enfin du plus proche au plus proche.","ar":"يا رسول الله، مَنْ أحقُّ بِحُسْن الصُّحبة؟ قال: أمك، ثم أمك، ثم أمك، ثم أباك، ثم أَدْنَاكَ أَدْنَاكَ","g":"[Authentique]","ref":"[Rapporté par Muslim - Rapporté par Al-Bukhârî et Muslim]"},{"id":3260,"fr":"Retourne auprès de tes parents et tiens leur compagnie de la plus belle des manières !","ar":"فارجع إلى والديك، فأحسن صحبتُهما","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":3044,"fr":"Les péchés majeurs sont : l’association à Allah, la désobéissance aux parents, le meurtre et le faux serment","ar":"الكبائر: الإشراك بالله، وعقوق الوالدين، وقتل النفس، واليمين الغموس","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî]"},{"id":3083,"fr":"N’est pas des nôtres celui qui ne fait pas preuve de miséricorde envers nos jeunes et n’honore pas nos anciens.","ar":"ليس منا من لم يرحم صغيرنا، ويعرف شرف كبيرنا","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî - Rapporté par Abû Dâwud - Rapporté par Aḥmad]"},{"id":6460,"fr":"Lorsque l'homme dépense pour sa famille et en escompte la récompense, c'est pour lui une aumône.","ar":"إذا أنفق الرجل على أهله يحتسبها فهو له صدقة","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":5352,"fr":"Que le jeune salue le vieux, que le passant salue celui qui est assis, et que le petit groupe salue le grand groupe.","ar":"ليسلم الصغير على الكبير، والمار على القاعد، والقليل على الكثير","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":4965,"fr":"Jibrîl (sur lui la paix) m'a tellement recommandé le voisin que j'ai pensé qu’il allait en faire un ayant droit à l’héritage.","ar":"ما زال يوصيني جبريل بالجار، حتى ظننت أنه سيورثه","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":4706,"fr":"Ne vous enviez pas, ne vous espionnez pas, ne vous haïssez pas, ne vous tournez pas le dos et ne surenchérissez pas les uns les autres sur une vente ! Soyez des serviteurs d’Allah, des frères !","ar":"لا تحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخوانا","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":4801,"fr":"Quiconque soulage un croyant d’une calamité parmi les calamités de ce bas monde, Allah le soulagera d’une calamité parmi les calamités du Jour de la Résurrection","ar":"من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":5514,"fr":"Quiconque défend l’honneur de son frère en son absence, Allah éloignera le Feu de son visage au Jour de la Résurrection.","ar":"من رد عن عرض أخيه رد الله عن وجهه النار يوم القيامة","g":"[Authentique]","ref":"[Rapporté par At-Tirmidhî et Ahmad]"},{"id":5647,"fr":"Lorsque le musulman rend visite à son frère musulman qui est malade, il est dans l’un des vergers du Paradis jusqu’à ce qu’il reparte.","ar":"إن المسلم إذا عاد أخاه المسلم لم يزل في خرفة الجنة حتى يرجع","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":6256,"fr":"Il n'est pas un musulman qui rende visite à un musulman malade, au matin, sans que soixante-dix mille Anges ne prient sur lui","ar":"ما من مسلم يعود مسلما غدوة إلا صلى عليه سبعون ألف ملك","g":"[Authentique]","ref":"[Rapporté par Ibn Mâjah - Rapporté par At-Tirmidhî - Rapporté par Abû Dâwud - Rapporté par Aḥmad]"},{"id":3017,"fr":"Lorsque l'homme aime son frère, qu’il l’informe de son amour pour lui.","ar":"إذا أحب الرجل أخاه فليخبره أنه يحبه","g":"[Authentique]","ref":"[Rapporté par Aboû Dâoud, At-Tirmidhî, An-Nassâ'î dans \"As-Sounan Al-Koubrâ\" et par Aḥmad]"},{"id":5338,"fr":"Lorsque vous êtes trois, que deux ne fassent pas d’aparté à l’écart de l’autre car cela l’attriste. Mêlez-vous plutôt aux gens !","ar":"إذا كنتم ثلاثة فلا يتناجى اثنان دون الآخر، حتى تختلطوا بالناس؛ من أجل أن ذلك يحزنه","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":5500,"fr":"Vos biens ne suffiront jamais à contenter les gens, alors contentez-les plutôt avec un visage souriant et un bon comportement.","ar":"إنَّكُمْ لَا تَسَعُونَ النَّاسَ بِأَمْوَالِكُمْ، وَلَكِنْ لِيَسَعْهُمْ مِنْكُمْ بَسْطُ الْوَجْهِ وَحُسْنُ الْخُلُقِ","g":"[Bon car renforcé par d'autres chaînes de rapporteurs]","ref":"[Rapporté par Al-Ḥâkim]"},{"id":8309,"fr":"Prenez garde aux invocations de celui qui subit l’injustice, car elles montent au ciel comme si elles étaient des flammes !","ar":"اتقوا دعوات المظلوم فإنها تصعد إلى السماء كأنها شرار","g":"[Authentique]","ref":"[Rapporté par Al-Ḥâkim]"},{"id":5942,"fr":"Ne vous informerais-je pas de ce qu’est le commérage ? C’est la calomnie colportée parmi les gens.","ar":"ألا هل أُنَبِّئُكم ما العَضْهُ؟ هي النَّمِيمَةُ القَالَةُ بينَ النَّاس","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":8877,"fr":"Lorsque l'homme dit : « Les gens sont perdus ! », il est le plus perdu d'entre eux !","ar":"إذا قال الرَّجُل: هَلَكَ الناس، فهو أَهْلَكُهُم","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":3344,"fr":"Parlez aux gens de ce qu’ils peuvent comprendre, voulez-vous que l'on démente Allah et Son Prophète ?","ar":"حدثوا الناس بما يعرفون، أتريدون أن يُكذَّب اللهُ ورسولهُ","g":"[Authentique]","ref":"[Rapporté par Al-Bûkhârî]"},{"id":3395,"fr":"Ô gens ! Attention à l’exagération dans la religion ! En effet, ce qui a anéanti ceux avant vous est l’exagération.","ar":"أيها الناس، إياكم والغلو في الدين، فإنما أهلك من كان قبلكم الغلو في الدين","g":"[Authentique]","ref":"[Rapporté par Ibn Mâjah, An-Nassâ'î et Ahmad]"},{"id":3034,"fr":"Ô vous, les gens ! Faîtes preuve de quiétude ! Car la bonté ne se trouve certainement pas dans l'empressement !","ar":"يا أيها الناس، عليكم بالسكينة، فإن البر ليس بالإيضاع","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":5799,"fr":"Certes, par son bon comportement, le croyant atteint le degré de celui qui jeûne le jour et prie la nuit.\"","ar":"إن المؤمن ليدرك بحسن خلقه درجة الصائم القائم","g":"[Authentique d'après ses supports]","ref":"[Rapporté par Abû Dâwud et Ahmad]"},{"id":5491,"fr":"Ô Allah ! De la même façon que tu as parfait ma création, parfais mon comportement !","ar":"اللَّهُمَّ كَمَا حَسَّنْت خَلْقِي فَحَسِّنْ خُلُقِي","g":"[Authentique]","ref":"[Rapporté par Aḥmad]"},{"id":6984,"fr":"Il n'est pas convenable, pour un véridique, d'être imprécateur.","ar":"لا ينبغي لصِدِّيق أن يكون لعّانًا","g":"[Authentique]","ref":"[Rapporté par Muslim]"},{"id":66523,"fr":"Parmi ce que les gens ont retenu comme parole de la première prophétie, il y a : \" Si tu n’as pas honte, alors fais ce que tu souhaites !","ar":"إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستحي فاصنع ما شئت","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî]"},{"id":8265,"fr":"Alors, certes, le comportement du Prophète (qu'Allah le couvre d'éloges et le préserve) était le Coran.","ar":"فإن خلق نبي الله صلى الله عليه وسلم كان القرآن","g":"[Authentique]","ref":"[Rapporté par Muslim dans la phrase d'un long hadith]"},{"id":6180,"fr":"Parmi les gens, le Messager d’Allah (qu'Allah le couvre d'éloges et le préserve) était celui doté du meilleur comportement.","ar":"كان رسول الله صلى الله عليه وسلم أحسن الناس خلقا","g":"[Authentique]","ref":"[Rapporté par Al Bukhârî et Muslim]"},{"id":3853,"fr":"Le menteur n'est pas celui qui réconcilie les gens en attribuant des paroles bienveillantes, ou en disant du bien.","ar":"ليس الكذاب الذي يصلح بين الناس فينمي خيرا، أو يقول خيرا","g":"[Authentique]","ref":"[Rapporté par Al-Bukhârî et Muslim]"},{"id":66541,"fr":"Que ta langue reste toujours humide du rappel d’Allah","ar":"لا يزال لسانك رطبا من ذكر الله","g":"[Authentique]","ref":"[Rapporté par Ahmad, At-Tirmidhî, Ibn Mâjah et Ibn Hibbân]"}];
(function(){
  const el=document.getElementById("splash"),inn=document.getElementById("splashIn");
  // Pas de répétition tant que la moitié des hadiths n'a pas été vue
  let seen=[];try{seen=JSON.parse(localStorage.getItem("mq-seen-hadiths")||"[]")}catch(e){}
  const pool=ACCUEIL.map((x,k)=>k).filter(k=>!seen.includes(ACCUEIL[k].id));
  const i=pool.length?pool[Math.floor(Math.random()*pool.length)]:Math.floor(Math.random()*ACCUEIL.length);
  seen.push(ACCUEIL[i].id);seen=seen.slice(-Math.floor(ACCUEIL.length/2));
  try{localStorage.setItem("mq-seen-hadiths",JSON.stringify(seen))}catch(e){}
  const h=ACCUEIL[i],c=s=>String(s||"").replace(/[\[\]]/g,"").replace(/\s*"\s*$/,"");
  inn.innerHTML=`<img src="icons/icon-512.png" alt=""><div class="sar">${esc(h.ar)}</div><div class="sfr ${c(h.fr).length>120?"long":""}">« ${esc(c(h.fr))} »</div><div class="sref">${esc(c(h.ref))} · ${esc(c(h.g))} · HadeethEnc n° ${h.id}</div><div class="sbar"><i></i></div>`;
  el.insertAdjacentHTML("beforeend",`<div class="tap" aria-hidden="true"><span class="ring"><i></i></span>Passer</div>`);
  const hide=()=>{if(el.classList.contains("out"))return;el.classList.add("out");setTimeout(installBanner,1800);USERMOVED=false;centerNow(true);setTimeout(()=>el.remove(),500)};
  let canSkip=false;el.onclick=()=>{if(canSkip)hide()};
  // Le compte de 3 secondes ne démarre qu'une fois le hadith réellement affiché à l'écran
  let started=false;
  const start=()=>{if(started||document.visibilityState!=="visible")return;started=true;
